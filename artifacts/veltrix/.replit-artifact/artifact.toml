kind = "web"
previewPath = "/"
title = "Veltrix Mobile Detailing"
version = "1.0.0"
id = "artifacts/veltrix"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23168

[services.development]
run = "pnpm --filter @workspace/veltrix run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/veltrix", "run", "build" ]
publicDir = "artifacts/veltrix/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23168"
BASE_PATH = "/"
