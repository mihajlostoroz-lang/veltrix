openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bookings
    description: Booking operations
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: gallery
    description: Gallery photo management endpoints.
  - name: reviews
    description: Customer review submission and moderation.
  - name: auth
    description: Admin authentication.
  - name: gallery-pairs
    description: Before/after gallery pair management.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /availability:
    get:
      operationId: getAvailability
      tags: [bookings]
      summary: Get available time slots for a date
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            description: Date in YYYY-MM-DD format
        - name: service
          in: query
          required: false
          schema:
            type: string
            description: Service name to use for duration-based conflict checking
      responses:
        "200":
          description: Available slots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      summary: List all bookings
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of bookings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingListResponse"
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a new booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Time slot already booked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bookings/{id}/reschedule:
    post:
      operationId: rescheduleBooking
      tags: [bookings]
      summary: Reschedule a booking to a new date and time slot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RescheduleBookingRequest"
      responses:
        "200":
          description: Rescheduled booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Time slot conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bookings/{id}:
    delete:
      operationId: deleteBooking
      tags: [bookings]
      summary: Delete a booking permanently
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: updateBookingStatus
      tags: [bookings]
      summary: Update booking status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBookingStatusRequest"
      responses:
        "200":
          description: Updated booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/login:
    post:
      operationId: adminLogin
      tags: [auth]
      summary: Log in as admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSessionResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/logout:
    post:
      operationId: adminLogout
      tags: [auth]
      summary: Log out
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /admin/me:
    get:
      operationId: getAdminMe
      tags: [auth]
      summary: Check admin session status
      responses:
        '200':
          description: Session info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSessionResponse'

  /gallery/pairs:
    get:
      operationId: listGalleryPairs
      tags: [gallery-pairs]
      summary: List all before/after pairs
      responses:
        '200':
          description: Gallery pairs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GalleryPairListResponse'
    post:
      operationId: createGalleryPair
      tags: [gallery-pairs]
      summary: Create a before/after pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGalleryPairRequest'
      responses:
        '201':
          description: Created pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GalleryPairResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /gallery/pairs/{id}:
    patch:
      operationId: updateGalleryPair
      tags: [gallery-pairs]
      summary: Edit service name or caption for a pair
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGalleryPairRequest'
      responses:
        '200':
          description: Updated pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GalleryPairResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteGalleryPair
      tags: [gallery-pairs]
      summary: Delete a before/after pair
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /reviews:
    get:
      operationId: listReviews
      tags: [reviews]
      summary: List approved reviews (public)
      responses:
        '200':
          description: Approved reviews
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewListResponse'
    post:
      operationId: createReview
      tags: [reviews]
      summary: Submit a customer review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
        '201':
          description: Review submitted (pending approval)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/reviews:
    get:
      operationId: listAdminReviews
      tags: [reviews]
      summary: List all reviews for admin
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        '200':
          description: All reviews
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewListResponse'

  /admin/reviews/{id}:
    patch:
      operationId: updateReviewStatus
      tags: [reviews]
      summary: Approve or reject a review
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReviewStatusRequest'
      responses:
        '200':
          description: Updated review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an uploaded object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /gallery/photos:
    get:
      operationId: listGalleryPhotos
      tags: [gallery]
      summary: List gallery photos
      parameters:
        - name: service
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Gallery photos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GalleryPhotoListResponse'
    post:
      operationId: createGalleryPhoto
      tags: [gallery]
      summary: Add a gallery photo entry after upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGalleryPhotoRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GalleryPhotoResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /gallery/photos/{id}:
    delete:
      operationId: deleteGalleryPhoto
      tags: [gallery]
      summary: Delete a gallery photo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GalleryPhotoResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [bookings]
      summary: Get booking stats
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AvailabilityResponse:
      type: object
      properties:
        date:
          type: string
        slots:
          type: array
          items:
            $ref: "#/components/schemas/TimeSlot"
      required:
        - date
        - slots

    TimeSlot:
      type: object
      properties:
        time:
          type: string
        label:
          type: string
        available:
          type: boolean
      required:
        - time
        - label
        - available

    CreateBookingRequest:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        service:
          type: string
        vehicle:
          type: string
          description: Car model (e.g. 2020 Honda Accord)
        plate:
          type: string
          description: License plate number
        date:
          type: string
        timeSlot:
          type: string
        notes:
          type: string
      required:
        - name
        - phone
        - service
        - vehicle
        - plate
        - date
        - timeSlot

    BookingResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        service:
          type: string
        vehicle:
          type: string
        plate:
          type: string
        date:
          type: string
        timeSlot:
          type: string
        notes:
          type: string
        status:
          type: string
        createdAt:
          type: string
      required:
        - id
        - name
        - phone
        - service
        - date
        - timeSlot
        - status
        - createdAt

    BookingListResponse:
      type: object
      properties:
        bookings:
          type: array
          items:
            $ref: "#/components/schemas/BookingResponse"
        total:
          type: integer
      required:
        - bookings
        - total

    RescheduleBookingRequest:
      type: object
      properties:
        date:
          type: string
          description: New date in YYYY-MM-DD format
        timeSlot:
          type: string
          description: New time slot in HH:MM 24hr format
      required:
        - date
        - timeSlot

    UpdateBookingStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum: [pending, confirmed, cancelled, completed]
      required:
        - status

    AdminStats:
      type: object
      properties:
        total:
          type: integer
        pending:
          type: integer
        confirmed:
          type: integer
        cancelled:
          type: integer
        today:
          type: integer
      required:
        - total
        - pending
        - confirmed
        - cancelled
        - today

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    ReviewResponse:
      type: object
      required: [id, name, rating, text, status, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        location:
          type: string
        vehicle:
          type: string
        rating:
          type: integer
        text:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        createdAt:
          type: string

    ReviewListResponse:
      type: object
      required: [reviews]
      properties:
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/ReviewResponse'
        total:
          type: integer

    CreateReviewRequest:
      type: object
      required: [name, rating, text]
      properties:
        name:
          type: string
        location:
          type: string
        vehicle:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        text:
          type: string

    UpdateReviewStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, approved, rejected]

    AdminLoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AdminSessionResponse:
      type: object
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
        username:
          type: string

    GalleryPairResponse:
      type: object
      required: [id, beforePath, afterPath, createdAt]
      properties:
        id:
          type: integer
        service:
          type: string
        caption:
          type: string
        beforePath:
          type: string
        afterPath:
          type: string
        createdAt:
          type: string

    GalleryPairListResponse:
      type: object
      required: [pairs]
      properties:
        pairs:
          type: array
          items:
            $ref: '#/components/schemas/GalleryPairResponse'

    CreateGalleryPairRequest:
      type: object
      required: [beforePath, afterPath]
      properties:
        service:
          type: string
        caption:
          type: string
        beforePath:
          type: string
        afterPath:
          type: string

    UpdateGalleryPairRequest:
      type: object
      properties:
        service:
          type: string
        caption:
          type: string

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1

    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'

    GalleryPhotoResponse:
      type: object
      required: [id, service, photoType, objectPath, sortOrder, createdAt]
      properties:
        id:
          type: integer
        service:
          type: string
        photoType:
          type: string
        objectPath:
          type: string
        caption:
          type: string
        sortOrder:
          type: integer
        createdAt:
          type: string

    GalleryPhotoListResponse:
      type: object
      required: [photos]
      properties:
        photos:
          type: array
          items:
            $ref: '#/components/schemas/GalleryPhotoResponse'

    CreateGalleryPhotoRequest:
      type: object
      required: [service, photoType, objectPath]
      properties:
        service:
          type: string
        photoType:
          type: string
        objectPath:
          type: string
        caption:
          type: string
        sortOrder:
          type: integer
